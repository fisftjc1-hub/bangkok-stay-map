<body><main class="policy-page"><a href="./">← Bangkok Trip Note</a><h1>隱私權</h1><p>更新日期：2026/10/12</p>
<p>本網站使用公開房源與景點資料，未加入使用者追蹤或分析程式，也未要求取得你的裝置即時位置。</p>
<p>啟用 Google Maps 地圖時，瀏覽器會向 Google 傳送地圖與路線請求，包括所選房源及景點座標。連線也會提供 IP 位址與一般瀏覽器資訊；相關處理依 <a href="https://policies.google.com/privacy?hl=zh-TW">Google 隱私權政策</a>。</p>
<p>其他地圖檢視會向 OpenStreetMap 請求底圖。網站由 GitHub Pages 提供，連線資料的處理依 <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">GitHub 隱私權聲明</a>。</p>
<p>房源與導航連結會前往第三方網站，資料處理由各該服務的隱私權政策規範。</p>
<p><a href="terms.html">使用條款</a></p></main></body></html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一次比較曼谷 8 間包棟住宿的位置、床位與參考價格。2026 年 12 月 13–16 日，15 人、3 晚。">
  <meta name="theme-color" content="#125c53">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Bangkok Trip Note</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=20261012-transit1">
  <script src="vendor/leaflet.js" defer></script>
  <script src="data.js" defer></script>
  <script src="itinerary.js?v=20261012-areas" defer></script>
  <script src="navigation.js?v=20261012-transit1" defer></script>
  <script src="maps-config.js?v=20261012-live2" defer></script>
  <script src="google-maps.js?v=20261012-transit1" defer></script>
  <script src="app.js?v=20261012-transit1" defer></script>
</head>
<body>
  <a class="skip" href="#stay-list">跳到住宿選項</a>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Bangkok Trip Note 首頁"><span class="brand-symbol" aria-hidden="true">B</span><h1>Bangkok Trip Note</h1></a>
    <div class="trip"><span>2026.12.13 — 12.16</span><span class="trip-divider"></span><span>15 人 · 3 晚</span></div>
    <a class="header-link" id="open-google" target="_blank" rel="noopener noreferrer">在 Google 地圖開啟 <span aria-hidden="true">↗</span></a>
  </header>
  <main class="workspace">
    <aside class="options-panel" aria-label="八間住宿比較">
      <div class="options-heading"><div><h2>房源</h2></div><span class="count">08</span></div>
      <div id="stay-list" class="stay-list"></div>
      <div class="source-note">資料與報價：2026/10/08</div>
      <div id="map-policies" class="map-policies" hidden><a href="terms.html">使用條款</a><a href="privacy.html">隱私權</a></div>
    </aside>
    <section class="map-panel" aria-label="Google 地圖與所有候選位置">
      <div class="map-toolbar"><div><span class="live-dot" aria-hidden="true"></span><strong id="map-label" aria-live="polite">全部 8 間住宿</strong></div><div class="map-actions"><button id="home-closeup" type="button" hidden>房源近景</button><button id="show-all" type="button">全部房源 <span aria-hidden="true">↗</span></button></div></div>
      <div class="map-modes" role="group" aria-label="地圖檢視"><button id="mode-routes" type="button" aria-pressed="true">動線</button><button id="mode-google" type="button" aria-pressed="false">Google 地圖</button></div>
      <nav id="day-tabs" class="day-tabs" aria-label="行程日期"></nav>
      <div class="map-wrap"><div id="route-map" aria-label="曼谷房源、行程動線與活動範圍"></div><div id="gmp-map" aria-label="Google Maps 房源與行程交通路線" hidden></div><div id="map-error" role="status" hidden></div><iframe id="stay-map" title="曼谷八間住宿的 Google 客製地圖" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" hidden></iframe></div>
      <div class="map-key"><span class="key-home">房源</span><button id="toggle-routes" class="key-route" type="button" aria-pressed="true">交通路線</button><span class="key-area">活動範圍（概略）</span><button id="fit-route" type="button">全部路線</button></div>
      <div id="route-settings" class="route-settings" hidden><label for="departure-time">出發時間（曼谷）</label><input id="departure-time" type="datetime-local" step="60"><button id="update-departure" type="button">更新路線</button><span id="departure-error" role="status" hidden></span></div>
      <section id="navigation-panel" class="navigation-panel" aria-label="交通路線比較" hidden></section>
      <section id="route-details" class="route-details" aria-label="行程動線"></section>
      <section id="location-analysis" class="location-analysis" aria-label="房源位置分析" hidden></section>
    </section>
  </main>
  <noscript><p>請啟用 JavaScript 顯示比較資料。也可以直接<a href="https://www.google.com/maps/d/viewer?mid=1jGxUs7SIGYx37n1bSOzc9mLkoMS_sEw">開啟完整 Google 地圖</a>。</p></noscript>
</body>
</html>

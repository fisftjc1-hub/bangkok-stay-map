<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="曼谷・沙美島旅遊攻略：2026 年 12 月 12–16 日每日行程、住宿、交通、景點資訊與實用須知。">
  <meta name="theme-color" content="#125c53">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Bangkok Trip Note</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=20261112-guide2">
  <link rel="stylesheet" href="guide.css?v=20261112-guide2">
  <script src="vendor/leaflet.js" defer></script>
  <script src="data.js?v=20261112-guide2" defer></script>
  <script src="itinerary.js?v=20261112-guide2" defer></script>
  <script src="guide-data.js?v=20261112-guide2" defer></script>
  <script src="navigation.js?v=20261112-guide2" defer></script>
  <script src="maps-config.js?v=20261012-live2" defer></script>
  <script src="google-maps.js?v=20261012-transit2" defer></script>
  <script src="app.js?v=20261112-guide2" defer></script>
  <script src="guide-app.js?v=20261112-guide2" defer></script>
</head>
<body>
  <a class="skip" href="#view">跳到主要內容</a>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="Bangkok Trip Note 首頁"><span class="brand-symbol" aria-hidden="true">B</span><h1>Bangkok Trip Note</h1></a>
    <nav class="tabs" id="tabs" aria-label="攻略分頁"></nav>
    <div class="search" role="search">
      <label class="visually-hidden" for="search-input">搜尋攻略</label>
      <input id="search-input" type="search" placeholder="搜尋：景點、地址、門票、電話…" autocomplete="off" enterkeyhint="search">
      <div id="search-results" class="search-results" hidden></div>
    </div>
  </header>
  <main id="view" class="guide" tabindex="-1">
    <section id="view-home" class="view" data-view="home" aria-label="總覽"></section>
    <section id="view-plan" class="view" data-view="plan" aria-label="每日行程" hidden></section>
    <section id="view-stay" class="view" data-view="stay" aria-label="住宿" hidden></section>
    <section id="view-move" class="view" data-view="move" aria-label="交通" hidden></section>
    <section id="view-map" class="view view-map" data-view="map" aria-label="地圖" hidden>
      <div class="map-panel">
        <div class="map-toolbar"><div><span class="live-dot" aria-hidden="true"></span><strong id="map-label" aria-live="polite">住宿與行程</strong></div><div class="map-actions"><button id="home-closeup" type="button" hidden>住宿近景</button><button id="show-all" type="button">回到總覽</button><a class="header-link" id="open-google" target="_blank" rel="noopener noreferrer">Google 地圖 <span aria-hidden="true">↗</span></a></div></div>
        <nav id="day-tabs" class="day-tabs" aria-label="行程日期"></nav>
        <div class="map-wrap"><div id="route-map" aria-label="住宿、行程動線與活動範圍"></div><div id="gmp-map" aria-label="Google Maps 住宿與行程交通路線" hidden></div><div id="map-error" role="status" hidden></div></div>
        <div class="map-key"><span class="key-home">住宿</span><button id="toggle-routes" class="key-route" type="button" aria-pressed="true">交通路線</button><span class="key-area">活動範圍（概略）</span><button id="fit-route" type="button">全部路線</button></div>
        <div id="route-settings" class="route-settings" hidden><label for="departure-time">出發時間（曼谷）</label><input id="departure-time" type="datetime-local" step="60"><button id="update-departure" type="button">更新路線</button><span id="departure-error" role="status" hidden></span></div>
        <section id="navigation-panel" class="navigation-panel" aria-label="交通路線" hidden></section>
        <section id="route-details" class="route-details" aria-label="行程動線"></section>
        <div id="map-policies" class="map-policies" hidden><a href="terms.html">使用條款</a><a href="privacy.html">隱私權</a></div>
      </div>
    </section>
    <section id="view-info" class="view" data-view="info" aria-label="實用資訊" hidden></section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <noscript><p class="noscript">請啟用 JavaScript 以顯示攻略內容。</p></noscript>
</body>
</html>
